name: Analyze watchlist

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 18:17 Bangkok, after SET close
    - cron: "43 21 * * 1-5"   # 04:43 Bangkok, after US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "yfinance>=0.2.54" pandas
      - name: Run analysis
        run: mkdir -p data && python scripts/analyze.py 2>&1 | tee data/run.log
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/run.log $(ls data/analysis.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Update watchlist analysis"
          git pull --rebase origin main
          git push
